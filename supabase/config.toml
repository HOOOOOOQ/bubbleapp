# Supabase CLI project configuration for BubbleApp.
# Local development: `supabase start`. Remote: `supabase link --project-ref <ref>` then `supabase db push`
# and `supabase functions deploy`. No secrets live in this file; see supabase/README.md and .env.example.

project_id = "bubbleapp"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["bubbleapp://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
# Email OTP sign-in. Users receive a one-time code, not a magic link.
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Functions authenticated by the caller's JWT (default: verify_jwt = true).
# Functions called by a scheduler or a database webhook have no user JWT. Each one checks its own
# shared secret (x-job-secret / x-webhook-secret) before doing any work.
[functions.scheduled-jobs]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.turn-credentials]
verify_jwt = true
