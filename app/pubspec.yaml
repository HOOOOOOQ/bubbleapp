name: bubbleapp
description: BubbleApp - premium messaging and social platform (Flutter + Supabase).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.6.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_webrtc: ^0.10.7
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  firebase_messaging: ^14.9.4
  firebase_core: ^2.32.0
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
